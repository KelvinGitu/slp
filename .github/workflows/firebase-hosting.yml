name: Deploy web app to Firebase Hosting

# Builds the Flutter web app and deploys it to
# https://solar-project-6a8a9.web.app on every push to main that touches the
# app. Pull requests only build and test.
#
# No secrets: GitHub's OIDC token is exchanged for short-lived credentials on
# github-actions-hosting@ through Workload Identity Federation, which only
# accepts tokens from KelvinGitu/slp.

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - '.github/workflows/firebase-hosting.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # required for Workload Identity Federation

jobs:
  build_and_deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in lockstep with the local SDK.
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build web
        run: flutter build web --release

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/189902921041/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-hosting@solar-project-6a8a9.iam.gserviceaccount.com

      # Pinned as in lisabem: 15.22.2/15.22.3 break ADC / Workload Identity auth
      # (https://github.com/firebase/firebase-tools/issues/10716).
      - name: Deploy to Firebase Hosting
        if: github.event_name != 'pull_request'
        run: npx firebase-tools@15.22.1 deploy --only hosting --project solar-project-6a8a9 --non-interactive
