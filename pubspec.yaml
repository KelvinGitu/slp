name: solartide
description: "SolarTide: solar installation quotes for installers in Kenya."
publish_to: 'none'

version: 2.0.0+5

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State, routing, errors
  flutter_riverpod: ^2.6.1
  routemaster: ^1.1.1
  fpdart: ^1.1.1

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.6.0

  # UI and formatting
  phosphor_flutter: ^2.1.0
  intl: ^0.20.2
  shimmer: ^3.0.0

  # Documents and sharing
  pdf: ^3.12.0
  printing: ^5.14.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

  # Utilities
  http: ^1.5.0
  image_picker: ^1.2.3
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/logos/

  # Google Sans, as in the other apps, bundled rather than fetched through
  # google_fonts so text renders the same offline. Weights 400/500/600/700 only.
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans/GoogleSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    background_color: '#EFEFEF'
    theme_color: '#36E3C5'
  image_path: 'assets/logos/logo.png'
  adaptive_icon_background: '#3A4750'
  adaptive_icon_foreground: 'assets/logos/logo.png'
